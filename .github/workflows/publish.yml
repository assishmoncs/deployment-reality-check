name: Release & Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Build, Verify & Publish to npm with Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm (fixes the npm 10 Arborist peer-resolution crash)
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Run full verification pipeline
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Publish to npm registry with OIDC Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
