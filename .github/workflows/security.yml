name: Security

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Pin npm (fixes the npm 10 Arborist peer-resolution crash)
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high

  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # This personal repository is private and does not have GitHub Code Security enabled.
      # Run the full analysis, but keep SARIF as a workflow artifact instead of uploading it.
      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          upload: never

      - name: Archive CodeQL SARIF results
        if: always() && steps.codeql.outputs.sarif-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ${{ steps.codeql.outputs.sarif-output }}
          if-no-files-found: warn
          retention-days: 14
