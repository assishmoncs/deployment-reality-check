name: One-time PR formatter

on:
  push:
    branches: [fix/ci-security-workflows]

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-security-workflows
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Pin npm
        run: npm install --global npm@11.21.2

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Format project
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Commit formatting and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src tests README.md docs
          git rm .github/workflows/format-pr.yml
          if git diff --cached --quiet; then
            echo "No formatting or lockfile changes to commit."
          else
            git commit -m "style: format source and lock dependencies"
            git push origin HEAD:fix/ci-security-workflows
          fi
